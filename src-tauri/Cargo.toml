[package]
name = "ironwatch"
version = "0.1.0"
description = "Real-time Linux system performance dashboard"
authors = []
edition = "2021"

[lib]
name = "ironwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
