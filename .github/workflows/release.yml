name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # matches v1.0.0, v0.3.2, etc.

# Only one release job at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full test suite before building the release binary
  test:
    name: Tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev \
            libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm install

      - name: Frontend tests
        run: npm test -- --run

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

  # Build and publish the release — only runs if tests pass
  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev \
            libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm install

      # tauri-action builds the app and creates a GitHub Release with
      # all platform bundles attached (.deb, .AppImage, .rpm where supported)
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}        # e.g. v1.0.0
          releaseName: "Ironwatch ${{ github.ref_name }}"
          releaseBody: |
            ## Ironwatch ${{ github.ref_name }}

            Real-time Linux system performance dashboard.

            ### Install

            **Debian/Ubuntu** — download the `.deb` and run:
            ```bash
            sudo dpkg -i ironwatch_*.deb
            ironwatch
            ```

            **AppImage** (any Linux) — download the `.AppImage` and run:
            ```bash
            chmod +x ironwatch_*.AppImage
            ./ironwatch_*.AppImage
            ```

            ### What's in this release
            See [SPEC.md](https://github.com/garysclaw/ironwatch/blob/main/SPEC.md) for full feature details.
          releaseDraft: false
          prerelease: false
